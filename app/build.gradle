apply plugin: 'com.android.application'

// CI builds (GitHub Actions) sign the debug APK with a fixed keystore decoded
// from the ANDROID_DEBUG_KEYSTORE_B64 secret so every build is install-over
// compatible. Local builds fall back to AGP's auto-generated debug keystore.
def ciDebugKeystorePath = System.getenv("ANDROID_DEBUG_KEYSTORE_PATH")

// Release signing is injected via environment variables (GitHub Actions
// secrets) so no keystore or password is ever committed. When the variables
// are absent the release build falls back to the debug keystore.
def ksPath = System.getenv("KEYSTORE_PATH")
def ksPassword = System.getenv("KEYSTORE_PASSWORD")
def ksAlias = System.getenv("KEY_ALIAS")
def ksKeyPassword = System.getenv("KEY_PASSWORD")
def hasReleaseSigning = ksPath && ksPassword && ksAlias && ksKeyPassword

android {
    namespace = 'com.benjoo.bsnake'
    compileSdk = 34

    defaultConfig {
        applicationId "com.benjoo.bsnake"
        minSdk = 16
        targetSdk = 34
        versionCode 25
        versionName "1.7.3"
    }

    signingConfigs {
        debug {
            if (ciDebugKeystorePath) {
                storeFile file(ciDebugKeystorePath)
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
        }
        release {
            if (hasReleaseSigning) {
                storeFile file(ksPath)
                storePassword ksPassword
                keyAlias ksAlias
                keyPassword ksKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
